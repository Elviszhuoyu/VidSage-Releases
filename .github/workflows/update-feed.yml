name: Publish Windows update feed
on:
  release:
    types: [published, edited, unpublished, deleted]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: windows-update-feed
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Generate feed from complete public releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: node tools/publish-update-feed.cjs "$GITHUB_REPOSITORY" updates/windows-x64.json
      - name: Save updated feed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add updates/windows-x64.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'chore: refresh Windows update feed'
          git push origin HEAD:main
